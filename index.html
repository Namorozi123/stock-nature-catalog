<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог планов</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1c2733;--mut:#6b7a8d;--accent:#1f4e78;--accent2:#2e75b6;--mark:#ffe58a}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15.5px}
header{position:sticky;top:0;z-index:20;background:var(--accent);color:#fff;padding:10px 16px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-size:17px;font-weight:700;white-space:nowrap}
.brand small{display:block;font-size:11px;font-weight:400;opacity:.85}
select,input,button{font-family:inherit;font-size:14px}
#sortSel{padding:6px 8px;border-radius:6px;border:none;background:#fff;color:var(--ink)}
#expBtn{padding:7px 12px;border-radius:6px;border:none;background:#1a7f4b;color:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
#expBtn:hover{background:#166b3f}
#langBtn{padding:7px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-weight:700;cursor:pointer}
#langBtn:hover{background:rgba(255,255,255,.15)}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border-radius:8px;border:none;outline:none}
.search svg{position:absolute;left:10px;top:9px;width:18px;height:18px;fill:var(--mut)}
.stats{font-size:12px;opacity:.9;white-space:nowrap}
.nav a{color:#cfe0f2;text-decoration:none;font-size:12px;margin-left:8px}
.nav a:hover{color:#fff}
.layout{display:flex;align-items:flex-start;gap:16px;max-width:1500px;margin:0 auto;padding:16px}
aside{position:sticky;top:70px;width:240px;flex:0 0 240px;background:var(--card);border:1px solid #e2e8f0;border-radius:12px;padding:14px;max-height:calc(100vh - 90px);overflow:auto}
aside h3{margin:14px 0 7px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
aside h3:first-child{margin-top:0}
.fg{display:flex;flex-wrap:wrap;gap:6px}
.tog{cursor:pointer;border:1px solid #e2e8f0;background:#fff;border-radius:20px;padding:6px 12px;font-size:13.5px;user-select:none;transition:.12s}
.tog:hover{border-color:var(--accent2)}
.tog .c{color:var(--mut);font-size:11px;margin-left:3px}
.tog.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
.tog.on .c{color:#dbe9f7}
.modeRow{display:flex;gap:6px;align-items:center;margin:6px 0 2px}
.modeRow .lbl{font-size:11px;color:var(--mut)}
.mode{cursor:pointer;border:1px solid #e2e8f0;background:#fff;border-radius:6px;padding:3px 9px;font-size:11.5px}
.mode.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.reset{margin-top:14px;width:100%;padding:9px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;color:var(--accent);font-weight:600}
.reset:hover{background:#eef4fb}
main{flex:1;min-width:0}
.count{color:var(--mut);margin:0 2px 12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.cell{background:var(--card);border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;cursor:default;transition:.12s;border-left:4px solid var(--sc,#ccc)}
.cell:hover{box-shadow:0 4px 14px rgba(0,0,0,.12);transform:translateY(-1px)}
.cell img{width:100%;height:auto;display:block;background:#e9eef3}
.cap{padding:11px 12px}
.capr{display:flex;gap:6px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
.sz{font-weight:700;font-size:15px;color:var(--accent)}
.tm{font-size:13.5px;color:var(--mut)}
.dur{font-size:13.5px;color:var(--mut);margin-left:auto}
.tgs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.chip{font-size:12.5px;padding:2px 9px;border-radius:20px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 30%,#fff);white-space:nowrap}
.vn{font-size:13.5px;color:#41506a;line-height:1.3;word-break:break-word}
.sp{font-size:13.5px;color:#6a3fa0;margin-top:4px;font-weight:600}
#sentinel{height:1px}
.empty{padding:40px;text-align:center;color:var(--mut)}
.ftog{display:none}
/* лайтбокс */
.lb{position:fixed;inset:0;background:rgba(15,22,30,.82);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.lb.on{display:flex}
.lbx{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:92vh;overflow:auto}
.lbx img{width:100%;border-radius:14px 14px 0 0;display:block}
.lbb{padding:16px 18px}
.lbb h2{margin:0 0 4px;font-size:16px}
.lbb .mt{color:var(--mut);font-size:12.5px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}
.kv div.k{color:var(--mut)}
.lbclose{position:absolute;top:16px;right:20px;font-size:30px;color:#fff;cursor:pointer;line-height:1}
.season-badge{padding:2px 9px;border-radius:6px;font-size:12px;font-weight:600;color:#3a2f10}
@media(max-width:860px){aside{position:static;width:100%;flex-basis:auto;max-height:none}.layout{flex-direction:column;padding:12px}.ftog{display:block;margin:0 0 6px;width:100%;padding:9px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;font-weight:600}aside.collapsed{display:none}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="brand"><span id="brandT">Каталог планов</span><small id="subTitle">—</small></div>
    <div class="search">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input id="q" type="search" placeholder="Поиск планов: ролик, объект, вид…" autocomplete="off">
    </div>
    <select id="sortSel" title="Сортировка">
      <option value="id" id="oId">По порядку</option>
      <option value="durd" id="oDurd">Дольше сначала</option>
      <option value="dura" id="oDura">Короче сначала</option>
      <option value="size" id="oSize">По крупности</option>
      <option value="video" id="oVideo">По ролику</option>
    </select>
    <button id="langBtn" title="Switch interface to English">EN</button>
    <button id="expBtn" title="Выгрузить кадры текущей выборки в Excel (без фото)">⬇ Excel</button>
    <div class="stats" id="stats"></div>
  </div>
</header>
<div class="layout">
  <button class="ftog" id="ftog">Фильтры ▾</button>
  <aside id="filters">
    <h3 id="hRegion">Регион</h3><div class="fg" id="fRegion"></div>
    <h3 id="hCountry">Страна</h3><div class="fg" id="fCountry"></div>
    <h3 id="hSeason">Сезон</h3><div class="fg" id="fSeason"></div>
    <h3 id="hFrame">Что в кадре</h3>
    <div class="modeRow"><span class="lbl" id="hMode">режим:</span>
      <span class="mode on" data-mode="and" id="mAnd">И (все)</span>
      <span class="mode" data-mode="or" id="mOr">ИЛИ (любое)</span>
    </div>
    <div class="fg" id="fCats"></div>
    <h3 id="hSize">Крупность плана</h3><div class="fg" id="fSizes"></div>
    <button class="reset" id="reset">Сбросить фильтры</button>
  </aside>
  <main>
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
    <div id="sentinel"></div>
  </main>
</div>
<script src="manifest_shots.js"></script>
<script>
const CATS=[["коптер","Коптер"],["горы","Горы"],["река","Реки"],["озеро","Озёра"],["лес","Лес"],
 ["море","Море/океан"],["водопад","Водопады"],["закат","Закаты/рассветы"],["пустыня","Пустыня"],
 ["подвода","Подводная"],["цветы","Цветы"],["животные","Животные"],["птицы","Птицы"]];
const CATDISP={};CATS.forEach(([k,l])=>CATDISP[k]=l);
const CATCOLOR={"коптер":"#00897b","горы":"#8d6e63","река":"#1e88e5","озеро":"#0277bd","лес":"#43a047","море":"#006064","водопад":"#00acc1","закат":"#fb8c00","пустыня":"#b8860b","подвода":"#3949ab","цветы":"#e91e63","животные":"#8e24aa","птицы":"#5e35b1"};
const SIZE_ORDER=["Дальний","Общий","Средний","Крупный","Деталь"];
const SIZE_RANK={"Дальний":0,"Общий":1,"Средний":2,"Крупный":3,"Деталь":4};
const SIZE_COLOR={"Дальний":"#90a4ae","Общий":"#42a5f5","Средний":"#66bb6a","Крупный":"#ffa726","Деталь":"#ef5350"};
const SEASONS=["Зима","Весна","Лето","Осень"];
const SEASON_COLOR={"Зима":"#dbeeff","Весна":"#dcf5dc","Лето":"#fff3c4","Осень":"#ffe0c2"};
let CAT=null,PLANS=[],filtered=[],shown=0;const PAGE=250;
const L18={
 ru:{brand:"Каталог планов",all:"все регионы",ph:"Поиск планов: ролик, объект, вид…",
  srt:{oId:"По порядку",oDurd:"Дольше сначала",oDura:"Короче сначала",oSize:"По крупности",oVideo:"По ролику"},
  exp:"⬇ Excel",expT:"Выгрузить кадры текущей выборки в Excel (без фото)",lang:"EN",langT:"Switch interface to English",
  ftog:"Фильтры ▾",hRegion:"Регион",hCountry:"Страна",hSeason:"Сезон",hFrame:"Что в кадре",hMode:"режим:",
  and:"И (все)",or:"ИЛИ (любое)",hSize:"Крупность плана",reset:"Сбросить фильтры",
  found:"Найдено кадров",total:"суммарно",statP:"кадров",statV:"роликов",statH:"ч",h:"ч",m:"мин",s:"с",
  empty:"В выборке нет кадров.",fname:"кадры_выборка",
  hdr:["№","Ролик","№ видео","Регион","Страна","Сезон","План №","Длительность, с","Тайм-код","Крупность","Теги","Животные/птицы"],
  cats:null,sizes:null,seasons:null},
 en:{brand:"Shot catalog",all:"all regions",ph:"Search shots: clip, subject, species…",
  srt:{oId:"Default order",oDurd:"Longest first",oDura:"Shortest first",oSize:"By shot size",oVideo:"By clip"},
  exp:"⬇ Excel",expT:"Export current selection to Excel (no photos)",lang:"RU",langT:"Вернуть русский интерфейс",
  ftog:"Filters ▾",hRegion:"Region",hCountry:"Country",hSeason:"Season",hFrame:"What is in frame",hMode:"mode:",
  and:"AND (all)",or:"OR (any)",hSize:"Shot size",reset:"Reset filters",
  found:"Shots found",total:"total",statP:"shots",statV:"clips",statH:"h",h:"h",m:"min",s:"s",
  empty:"No shots in the selection.",fname:"shots_selection",
  hdr:["#","Clip","Clip #","Region","Country","Season","Shot #","Duration, s","Timecode","Shot size","Tags","Animals/birds"],
  cats:{"коптер":"Aerial (drone)","горы":"Mountains","река":"Rivers","озеро":"Lakes","лес":"Forest","море":"Sea / ocean","водопад":"Waterfalls","закат":"Sunsets / sunrises","пустыня":"Desert","подвода":"Underwater","цветы":"Flowers","животные":"Animals","птицы":"Birds"},
  sizes:{"Дальний":"Extreme long","Общий":"Long","Средний":"Medium","Крупный":"Close-up","Деталь":"Extreme close-up"},
  seasons:{"Зима":"Winter","Весна":"Spring","Лето":"Summer","Осень":"Autumn"}}
};
let TOTV=0,TOTD=0;
function LG(){return L18[state.lang]||L18.ru;}
function dCat(k){const d=LG().cats;return (d&&d[k])||CATDISP[k]||k;}
function dSize(x){const d=LG().sizes;return (d&&d[x])||x;}
function dSeason(x){const d=LG().seasons;return (d&&d[x])||x;}
function tc(sec){sec=Math.max(0,Math.round(sec));const m=Math.floor(sec/60),r=sec%60;return m+":"+String(r).padStart(2,"0");}
function setTxt(id,t){const e=document.getElementById(id);if(e)e.textContent=t;}
function applyLang(){
  const L=LG();
  setTxt("brandT",L.brand);setTxt("subTitle",L.all);
  const q=document.getElementById("q");if(q)q.placeholder=L.ph;
  for(const k in L.srt)setTxt(k,L.srt[k]);
  const eb=document.getElementById("expBtn");if(eb){eb.textContent=L.exp;eb.title=L.expT;}
  const lb=document.getElementById("langBtn");if(lb){lb.textContent=L.lang;lb.title=L.langT;}
  setTxt("ftog",L.ftog);setTxt("hRegion",L.hRegion);setTxt("hCountry",L.hCountry);setTxt("hSeason",L.hSeason);
  setTxt("hFrame",L.hFrame);setTxt("hMode",L.hMode);setTxt("mAnd",L.and);setTxt("mOr",L.or);
  setTxt("hSize",L.hSize);setTxt("reset",L.reset);
  document.documentElement.lang=state.lang;
  updStats();buildFilters();render();
}
function updStats(){const L=LG();const e=document.getElementById("stats");
  if(e)e.textContent=PLANS.length+" "+L.statP+" · "+TOTV+" "+L.statV+" · "+(TOTD/3600).toFixed(1)+" "+L.statH;}

let state={q:"",regions:new Set(),countries:new Set(),seasons:new Set(),cats:new Set(),sizes:new Set(),mode:"and",sort:"id",lang:"ru"};
function esc(s){return (s==null?"":String(s)).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function hl(s){s=esc(s);const q=state.q.trim();if(!q)return s;try{const rx=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");return s.replace(rx,"<mark>$1</mark>");}catch(e){return s;}}
function fmtDur(sec){const m=Math.floor(sec/60),s=Math.round(sec%60);return m?(m+":"+String(s).padStart(2,"0")):(Math.round(sec)+"с");}
function fmtTotal(sec){const L=LG();sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;const p=[];if(h)p.push(h+" "+L.h);if(m)p.push(m+" "+L.m);p.push(s+" "+L.s);return p.join(" ");}
function loadCatalogs(){
  const list=window.SHOTS_MANIFEST||[];
  if(!list.length){document.getElementById("grid").innerHTML='<div class="empty">Нет данных.</div>';return;}
  let done=0;const fin=()=>{if(++done===list.length){bindUI(list);buildCombined();}};
  list.forEach(m=>{const sc=document.createElement("script");sc.src=m.file;sc.onload=fin;sc.onerror=fin;document.head.appendChild(sc);});
}
function bindUI(list){
  document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value;render();});
  document.getElementById("sortSel").addEventListener("change",e=>{state.sort=e.target.value;render();});
  document.getElementById("reset").addEventListener("click",resetFilters);
  document.getElementById("mAnd").addEventListener("click",()=>setMode("and"));
  document.getElementById("mOr").addEventListener("click",()=>setMode("or"));
  document.getElementById("ftog").addEventListener("click",()=>document.getElementById("filters").classList.toggle("collapsed"));
  document.getElementById("expBtn").addEventListener("click",exportXls);
  document.getElementById("langBtn").addEventListener("click",function(){state.lang=(state.lang==="ru"?"en":"ru");applyLang();});
  const io=new IntersectionObserver(es=>{if(es[0].isIntersecting)more();},{rootMargin:"600px"});
  io.observe(document.getElementById("sentinel"));
  if(window.innerWidth<=860)document.getElementById("filters").classList.add("collapsed");
}
function setMode(m){state.mode=m;document.getElementById("mAnd").classList.toggle("on",m==="and");document.getElementById("mOr").classList.toggle("on",m==="or");render();}
function resetFilters(){state.q="";state.regions.clear();state.countries.clear();state.seasons.clear();state.cats.clear();state.sizes.clear();document.getElementById("q").value="";buildFilters();render();}
function buildCombined(){
  const cats=window.SHOTS_CATALOGS||{};
  const ids=(window.SHOTS_MANIFEST||[]).map(m=>m.id).filter(id=>cats[id]);
  let plans=[],videos=0,dur=0;
  ids.forEach(id=>{const c=cats[id];(c.plans||[]).forEach(p=>plans.push(p));videos+=c.videos||0;dur+=c.dur||0;});
  CAT={title:"все регионы",plans:plans,videos:videos,dur:dur};PLANS=plans;
  document.getElementById("subTitle").textContent=LG().all;
  PLANS.forEach(p=>{const parts=[p.vname,p.season,p.region,p.country,p.animal||"",p.bird||"",p.size];p.tags.forEach(k=>parts.push(CATDISP[k]||k));p._s=parts.join(" ").toLowerCase();});
  state.regions.clear();state.countries.clear();state.seasons.clear();state.cats.clear();state.sizes.clear();
  buildFilters();render();
  TOTV=videos;TOTD=dur;updStats();
}
function cntP(fn){let n=0;for(const p of PLANS)if(fn(p))n++;return n;}
function buildFilters(){
  const fR=document.getElementById("fRegion");fR.innerHTML="";
  const regs=[...new Set(PLANS.map(p=>p.region))].sort((a,b)=>a.localeCompare(b,"ru"));
  regs.forEach(rg=>{const n=cntP(p=>p.region===rg);if(n)fR.appendChild(mkTog(rg,n,state.regions,rg));});
  const fCo=document.getElementById("fCountry");fCo.innerHTML="";
  const cos=[...new Set(PLANS.map(p=>p.country))].sort((a,b)=>a.localeCompare(b,"ru"));
  cos.forEach(co=>{const n=cntP(p=>p.country===co);if(n)fCo.appendChild(mkTog(co,n,state.countries,co));});
  const fS=document.getElementById("fSeason");fS.innerHTML="";
  SEASONS.forEach(s=>{const n=cntP(p=>p.season===s);if(n)fS.appendChild(mkTog(dSeason(s),n,state.seasons,s));});
  const fC=document.getElementById("fCats");fC.innerHTML="";
  CATS.forEach(([k,lab])=>{const n=cntP(p=>p.tags.indexOf(k)>=0);if(n)fC.appendChild(mkTog(dCat(k),n,state.cats,k));});
  const fZ=document.getElementById("fSizes");fZ.innerHTML="";
  SIZE_ORDER.forEach(s=>{const n=cntP(p=>p.size===s);if(n)fZ.appendChild(mkTog(dSize(s),n,state.sizes,s));});
}
function mkTog(label,n,set,key){const b=document.createElement("span");b.className="tog"+(set.has(key)?" on":"");b.innerHTML=esc(label)+'<span class="c">'+n+'</span>';b.addEventListener("click",()=>{set.has(key)?set.delete(key):set.add(key);b.classList.toggle("on");render();});return b;}
function match(p){
  if(state.regions.size&&!state.regions.has(p.region))return false;
  if(state.countries.size&&!state.countries.has(p.country))return false;
  if(state.seasons.size&&!state.seasons.has(p.season))return false;
  if(state.sizes.size&&!state.sizes.has(p.size))return false;
  if(state.cats.size){
    if(state.mode==="and"){for(const c of state.cats)if(p.tags.indexOf(c)<0)return false;}
    else{let ok=false;for(const c of state.cats)if(p.tags.indexOf(c)>=0){ok=true;break;}if(!ok)return false;}
  }
  const q=state.q.trim().toLowerCase();if(q&&p._s.indexOf(q)<0)return false;
  return true;
}
function sortP(a){const s=state.sort,arr=a.slice();
  if(s==="durd")arr.sort((x,y)=>y.dur-x.dur);
  else if(s==="dura")arr.sort((x,y)=>x.dur-y.dur);
  else if(s==="size")arr.sort((x,y)=>SIZE_RANK[y.size]-SIZE_RANK[x.size]||x.gid-y.gid);
  else if(s==="video")arr.sort((x,y)=>x.vname.localeCompare(y.vname,"ru")||x.gid-y.gid);
  else arr.sort((x,y)=>x.gid-y.gid);
  return arr;}
function chipsHTML(p){return p.tags.map(k=>'<span class="chip" style="--c:'+(CATCOLOR[k]||"#888")+'">'+esc(dCat(k))+'</span>').join("");}
function cellHTML(p,i){
  const sp=(p.bird?'<div class="sp">🐦 '+esc(p.bird)+'</div>':'')+(p.animal?'<div class="sp">🐾 '+esc(p.animal)+'</div>':'');
  return '<figure class="cell" data-i="'+i+'" style="--sc:'+(SEASON_COLOR[p.season]||"#ccc")+'">'+
    '<img loading="lazy" src="'+esc(p.img)+'" alt="">'+
    '<figcaption class="cap">'+
      '<div class="capr"><span class="sz" style="color:'+(SIZE_COLOR[p.size]||"#333")+'">'+esc(dSize(p.size))+'</span>'+
      '<span class="tm">'+p.t0+'–'+p.t1+'с</span><span class="dur">'+fmtDur(p.dur)+'</span></div>'+
      '<div class="tgs">'+chipsHTML(p)+'</div>'+sp+
      '<div class="vn">📍 '+esc(p.region)+' · #'+p.vid+' '+hl(p.vname)+'</div>'+
    '</figcaption></figure>';
}
function render(){
  if(!CAT)return;filtered=sortP(PLANS.filter(match));shown=0;
  let _sum=0;for(const _p of filtered)_sum+=_p.dur;
  const L=LG();document.getElementById("count").innerHTML=L.found+": <b>"+filtered.length+"</b> · "+L.total+" <b>"+fmtTotal(_sum)+"</b> ("+Math.round(_sum)+" "+L.s+")";
  document.getElementById("grid").innerHTML="";more();
}
function more(){
  if(shown>=filtered.length)return;
  const end=Math.min(shown+PAGE,filtered.length);let h="";
  for(let i=shown;i<end;i++)h+=cellHTML(filtered[i],i);
  document.getElementById("grid").insertAdjacentHTML("beforeend",h);shown=end;
}
function openLB(i){
  const p=filtered[i];if(!p)return;
  const rows=[["Ролик","#"+p.vid+" "+esc(p.vname)],["Страна / регион",esc(p.country)+" · "+esc(p.region)],
    ["Сезон",'<span class="season-badge" style="background:'+(SEASON_COLOR[p.season]||"#eee")+'">'+esc(p.season)+'</span>'],
    ["План № в ролике",p.sn],["Время",p.t0+"–"+p.t1+" с"],["Длительность",fmtDur(p.dur)],
    ["Крупность",'<b style="color:'+(SIZE_COLOR[p.size]||"#333")+'">'+esc(p.size)+'</b>'],
    ["В кадре",p.tags.length?chipsHTML(p):"—"]];
  if(p.animal)rows.push(["Животные",esc(p.animal)]);
  if(p.bird)rows.push(["Птицы",esc(p.bird)]);
  document.getElementById("lbx").innerHTML='<img src="'+esc(p.img)+'">'+'<div class="lbb"><h2>'+esc(p.size)+' · '+p.t0+'–'+p.t1+'с</h2>'+
    '<div class="mt">'+esc(p.vname)+'</div><div class="kv">'+rows.map(r=>'<div class="k">'+r[0]+'</div><div>'+r[1]+'</div>').join("")+'</div></div>';
  document.getElementById("lb").classList.add("on");
}
function closeLB(){document.getElementById("lb").classList.remove("on");}
function exportXls(){
  const L=LG();
  if(!filtered||!filtered.length){alert(L.empty);return;}
  let t='<table border="1"><tr>'+L.hdr.map(h=>'<th>'+esc(h)+'</th>').join("")+'</tr>';
  filtered.forEach(function(p,i){
    const tags=p.tags.map(k=>dCat(k)).join(", ");
    const sp=[p.animal||"",p.bird||""].filter(Boolean).join(", ");
    const cells=[i+1,p.vname,p.vid,p.region,p.country,dSeason(p.season),p.sn,
                 Math.round(p.dur),tc(p.t0)+"-"+tc(p.t1),dSize(p.size),tags,sp];
    t+='<tr>'+cells.map(c=>'<td>'+esc(String(c))+'</td>').join("")+'</tr>';
  });
  t+='</table>';
  const doc='<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>Shots</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head><body>'+t+'</body></html>';
  const blob=new Blob(["\ufeff"+doc],{type:"application/vnd.ms-excel"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=L.fname+"_"+filtered.length+".xls";document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},400);
}
loadCatalogs();
</script>
